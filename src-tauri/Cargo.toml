[package]
name = "pg-column-reorder"
version = "0.2.0"
description = "PostgreSQL physical column reorder tool"
authors = ["PG Reorder"]
edition = "2021"

[lib]
name = "pg_column_reorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "rt"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio-postgres = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
