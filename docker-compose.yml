services:
  app:
    build: .
    environment:
      DOCKERIZED: "true"
      HOST: 0.0.0.0
      PORT: 3210
    ports:
      - "3210:3210"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reorder
      POSTGRES_PASSWORD: reorder
      POSTGRES_DB: reorder
    ports:
      - "55432:5432"
    volumes:
      - ./test/fixture.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reorder -d reorder"]
      interval: 2s
      timeout: 3s
      retries: 20
    profiles:
      - test
